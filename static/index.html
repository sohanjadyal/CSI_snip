<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snip - modern link shortener</title>
<style>
  :root {
    --bg-base: #f8fafc;
    --bg-card: #ffffff;
    --bg-input: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --primary: #0284c7;
    --primary-hover: #0369a1;
    --primary-light: #e0f2fe;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --danger-hover: #dc2626;
    --success: #10b981;
    --success-light: #d1fae5;
    --badge-bg: #e2e8f0;
    --badge-text: #334155;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    --radius: 10px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    --bg-base: #0b0f19;
    --bg-card: #151c2e;
    --bg-input: #1e293b;
    --border: #27354f;
    --border-hover: #3b4d70;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #38bdf8;
    --primary-hover: #0ea5e9;
    --primary-light: rgba(56, 189, 248, 0.15);
    --danger: #f87171;
    --danger-light: rgba(239, 68, 68, 0.15);
    --danger-hover: #ef4444;
    --success: #34d399;
    --success-light: rgba(16, 185, 129, 0.15);
    --badge-bg: #1e293b;
    --badge-text: #cbd5e1;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    line-height: 1.5;
    padding: 32px 16px 64px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    font-size: 2rem;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .brand h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--primary), #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand p {
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .theme-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }

  .theme-toggle:hover {
    border-color: var(--primary);
    transform: rotate(15deg);
  }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-md);
    margin-bottom: 24px;
    transition: var(--transition);
  }

  .card:hover {
    box-shadow: var(--shadow-lg);
  }

  /* Form */
  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 520px) {
    .form-row { grid-template-columns: 1fr; }
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-size: 0.95rem;
    background: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: var(--transition);
  }

  input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  input::placeholder {
    color: var(--text-muted);
    opacity: 0.7;
  }

  .btn-primary {
    width: 100%;
    padding: 12px 20px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
  }

  [data-theme="dark"] .btn-primary {
    color: #0b0f19;
    box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Result Box */
  #result {
    margin-top: 16px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 12px;
    animation: fadeIn 0.3s ease;
  }

  .alert-error {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  .success-box {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    animation: fadeIn 0.3s ease;
  }

  .success-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .success-row:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }

  .success-info {
    overflow: hidden;
  }

  .success-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .success-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.95rem;
    word-break: break-all;
    font-weight: 600;
  }

  .success-val a {
    color: var(--primary);
    text-decoration: none;
  }

  .success-val a:hover {
    text-decoration: underline;
  }

  .btn-copy {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-copy:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .btn-copy.copied {
    background: var(--success);
    color: #ffffff;
    border-color: var(--success);
  }

  /* Recent Links Section */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .btn-refresh {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 0.8125rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-refresh:hover {
    color: var(--text-main);
    border-color: var(--border-hover);
  }

  .links-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    gap: 12px;
    transition: var(--transition);
  }

  .link-card:hover {
    border-color: var(--border-hover);
    transform: translateX(2px);
  }

  .link-meta {
    overflow: hidden;
    flex: 1;
  }

  .link-primary-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .link-code {
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .link-code:hover {
    text-decoration: underline;
  }

  .link-clicks {
    background: var(--badge-bg);
    color: var(--badge-text);
    padding: 2px 7px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .link-target {
    font-size: 0.8125rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-icon {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-icon:hover {
    color: var(--text-main);
    border-color: var(--primary);
  }

  .btn-delete {
    color: var(--danger);
  }

  .btn-delete:hover {
    background: var(--danger-light);
    border-color: var(--danger);
    color: var(--danger);
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <span class="brand-icon">✂️</span>
      <div>
        <h1>snip</h1>
        <p>Paste a long link, get a fast and clean short one.</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
      🌙
    </button>
  </header>

  <div class="card">
    <form id="form">
      <div class="form-group">
        <label for="url">Destination URL</label>
        <input id="url" type="text" placeholder="https://example.com/very/long/url" aria-label="Link to shorten" required autofocus>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="alias">Custom Alias (Optional)</label>
          <input id="alias" type="text" placeholder="e.g. my-link" aria-label="Custom name">
        </div>
        <div class="form-group">
          <label for="expires">Expiration</label>
          <select id="expires" aria-label="Expires">
            <option value="0">Never expires</option>
            <option value="3600">Expires in 1 hour</option>
            <option value="86400">Expires in 1 day</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="submitBtn" type="submit">
        <span>Shorten Link</span>
      </button>
    </form>
    <div id="result"></div>
  </div>

  <div class="section-header">
    <h2 class="section-title">Recent Links</h2>
    <button class="btn-refresh" id="refreshBtn" type="button">↻ Refresh</button>
  </div>
  <div class="links-list" id="linksList">
    <div class="empty-state">Loading links...</div>
  </div>
</div>

<script>
  // Theme Toggle with LocalStorage & OS Preference
  const themeToggle = document.getElementById('themeToggle');
  const storedTheme = localStorage.getItem('snip_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = storedTheme || (prefersDark ? 'dark' : 'light');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('snip_theme', theme);
  }

  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // Stored Delete Tokens in LocalStorage
  const TOKENS_KEY = 'snip_delete_tokens';
  function getStoredTokens() {
    try {
      return JSON.parse(localStorage.getItem(TOKENS_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveDeleteToken(code, token) {
    const tokens = getStoredTokens();
    tokens[code] = token;
    localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
  }

  function removeDeleteToken(code) {
    const tokens = getStoredTokens();
    delete tokens[code];
    localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
  }

  // Copy Helper
  async function copyToClipboard(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const originalText = btn.textContent;
      btn.classList.add('copied');
      btn.textContent = '✓ Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = originalText;
      }, 2000);
    } catch (err) {
      prompt('Copy manually:', text);
    }
  }

  // Form Submission
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const resultDiv = document.getElementById('result');

  form.onsubmit = async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Shortening...';
    resultDiv.textContent = '';

    try {
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: document.getElementById('url').value.trim(),
          alias: document.getElementById('alias').value.trim(),
          expires_in: Number(document.getElementById('expires').value)
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        const alertEl = document.createElement('div');
        alertEl.className = 'alert alert-error';
        alertEl.textContent = data.error || 'Failed to create link.';
        resultDiv.textContent = '';
        resultDiv.appendChild(alertEl);
        return;
      }

      saveDeleteToken(data.code, data.delete_token);

      const successBox = document.createElement('div');
      successBox.className = 'success-box';

      // Row 1: Shortened URL
      const row1 = document.createElement('div');
      row1.className = 'success-row';

      const info1 = document.createElement('div');
      info1.className = 'success-info';

      const label1 = document.createElement('div');
      label1.className = 'success-label';
      label1.textContent = 'Shortened URL';

      const val1 = document.createElement('div');
      val1.className = 'success-val';

      const linkEl = document.createElement('a');
      linkEl.href = data.short_url;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener';
      linkEl.textContent = data.short_url;

      val1.appendChild(linkEl);
      info1.appendChild(label1);
      info1.appendChild(val1);

      const copyBtn1 = document.createElement('button');
      copyBtn1.className = 'btn-copy';
      copyBtn1.type = 'button';
      copyBtn1.textContent = '📋 Copy Link';
      copyBtn1.addEventListener('click', () => copyToClipboard(data.short_url, copyBtn1));

      row1.appendChild(info1);
      row1.appendChild(copyBtn1);

      // Row 2: Delete Token
      const row2 = document.createElement('div');
      row2.className = 'success-row';

      const info2 = document.createElement('div');
      info2.className = 'success-info';

      const label2 = document.createElement('div');
      label2.className = 'success-label';
      label2.textContent = 'Delete Token (keep secret)';

      const val2 = document.createElement('div');
      val2.className = 'success-val';
      val2.textContent = data.delete_token;

      info2.appendChild(label2);
      info2.appendChild(val2);

      const copyBtn2 = document.createElement('button');
      copyBtn2.className = 'btn-copy';
      copyBtn2.type = 'button';
      copyBtn2.textContent = '🔑 Copy Token';
      copyBtn2.addEventListener('click', () => copyToClipboard(data.delete_token, copyBtn2));

      row2.appendChild(info2);
      row2.appendChild(copyBtn2);

      successBox.appendChild(row1);
      successBox.appendChild(row2);

      resultDiv.textContent = '';
      resultDiv.appendChild(successBox);

      form.reset();
      loadRecentLinks();
    } catch (err) {
      const alertEl = document.createElement('div');
      alertEl.className = 'alert alert-error';
      alertEl.textContent = 'Network error. Please try again.';
      resultDiv.textContent = '';
      resultDiv.appendChild(alertEl);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Shorten Link';
    }
  };

  // Recent Links Dashboard
  const linksList = document.getElementById('linksList');
  const refreshBtn = document.getElementById('refreshBtn');

  async function loadRecentLinks() {
    try {
      const res = await fetch('/api/links?limit=15');
      if (!res.ok) throw new Error('Failed to load');
      const links = await res.json();

      linksList.textContent = '';

      if (!links || links.length === 0) {
        const emptyEl = document.createElement('div');
        emptyEl.className = 'empty-state';
        emptyEl.textContent = 'No links shortened yet. Create your first link above!';
        linksList.appendChild(emptyEl);
        return;
      }

      links.forEach(link => {
        const fullShort = window.location.origin + '/' + link.code;

        const card = document.createElement('div');
        card.className = 'link-card';
        card.id = 'link-card-' + link.code;

        const meta = document.createElement('div');
        meta.className = 'link-meta';

        const primaryLine = document.createElement('div');
        primaryLine.className = 'link-primary-line';

        const codeLink = document.createElement('a');
        codeLink.className = 'link-code';
        codeLink.href = '/' + encodeURIComponent(link.code);
        codeLink.target = '_blank';
        codeLink.rel = 'noopener';
        codeLink.textContent = '/' + link.code;

        const clicksSpan = document.createElement('span');
        clicksSpan.className = 'link-clicks';
        clicksSpan.textContent = link.clicks + (link.clicks === 1 ? ' click' : ' clicks');

        primaryLine.appendChild(codeLink);
        primaryLine.appendChild(clicksSpan);

        const targetDiv = document.createElement('div');
        targetDiv.className = 'link-target';
        targetDiv.title = link.url;
        targetDiv.textContent = link.url;

        meta.appendChild(primaryLine);
        meta.appendChild(targetDiv);

        const actions = document.createElement('div');
        actions.className = 'link-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn-icon';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy Short Link';
        copyBtn.textContent = '📋 Copy';
        copyBtn.addEventListener('click', () => copyToClipboard(fullShort, copyBtn));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-icon btn-delete';
        deleteBtn.type = 'button';
        deleteBtn.title = 'Delete Link';
        deleteBtn.textContent = '🗑️ Delete';
        deleteBtn.addEventListener('click', () => deleteLinkPrompt(link.code));

        actions.appendChild(copyBtn);
        actions.appendChild(deleteBtn);

        card.appendChild(meta);
        card.appendChild(actions);

        linksList.appendChild(card);
      });
    } catch (err) {
      const errorEl = document.createElement('div');
      errorEl.className = 'empty-state';
      errorEl.textContent = 'Could not load recent links.';
      linksList.textContent = '';
      linksList.appendChild(errorEl);
    }
  }

  async function deleteLinkPrompt(code) {
    const storedTokens = getStoredTokens();
    let token = storedTokens[code];

    if (!token) {
      token = prompt(`Enter the delete token for link "/${code}":`);
      if (!token) return;
    } else {
      if (!confirm(`Are you sure you want to delete "/${code}"?`)) return;
    }

    try {
      const res = await fetch('/api/links/' + encodeURIComponent(code), {
        method: 'DELETE',
        headers: {
          'X-Delete-Token': token.trim()
        }
      });

      if (res.status === 204) {
        removeDeleteToken(code);
        const card = document.getElementById('link-card-' + code);
        if (card) card.remove();
        loadRecentLinks();
      } else {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Failed to delete link. Incorrect token.');
      }
    } catch (err) {
      alert('Network error while deleting link.');
    }
  }

  refreshBtn.addEventListener('click', loadRecentLinks);
  loadRecentLinks();
</script>
</body>
</html>
